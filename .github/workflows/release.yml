name: Release

# A tag such as v0.2.0 builds both Mac disk images and leaves them on a draft release,
# which someone has to read and publish by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p . --noEmit
      - run: npm test
      - run: npm run dist
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg --draft --generate-notes
